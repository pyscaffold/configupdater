# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

python:
  install:
    # Installs the package and the `docs` dependency group from uv.lock
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
