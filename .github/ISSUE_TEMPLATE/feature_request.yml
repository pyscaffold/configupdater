name: Feature request
description: Suggest an idea for ConfigUpdater
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and what is the problem? Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        What would you like to see? If `ConfigParser` offers something similar, please
        mention it, since ConfigUpdater follows its API.
    validations:
      required: true
