name: Bug report
description: Report something that doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to report a problem! ConfigUpdater mirrors the
        stdlib's `ConfigParser` except where it preserves the formatting, so if you
        can, please also tell us what `ConfigParser` does with the same input.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal reproducible example
      description: A minimal, self-contained example, including the content of the config file.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or output
      render: text
  - type: input
    id: configupdater-version
    attributes:
      label: ConfigUpdater version
      placeholder: "3.2"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.14.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: dropdown
    id: installer
    attributes:
      label: How did you install ConfigUpdater?
      options: [pip, uv, conda, other]
